[package]
name = "data-service"
description = ""
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.100"
arc-swap = "1.7.1"
axum = { version = "0.8.7", features = ["http2", "macros"] }
axum-extra = { version = "0.12.2", features = ["typed-header"] }
axum-tracing-opentelemetry = "0.42.1"
dotenvy = { git = "https://github.com/allan2/dotenvy" }
entity = { path = "../entity" }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
    "grpc-tonic",
    "trace",
    "internal-logs",
] }
opentelemetry_sdk = "0.33.1"
sea-orm = { version = "2.0.0-rc.36", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.145"
tap = "1.0.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
tracing = "0.1"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
